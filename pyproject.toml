# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "saigonos"
version = "0.1.0"
description = "Hệ điều hành chuyển đổi số (DX-OS) nguồn mở"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SaigonOS contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["click>=8.2"]

[project.scripts]
saigonos = "saigonos.cli:main"

[project.urls]
Homepage = "https://github.com/tynnpdhsp/SaigonOS"
Issues = "https://github.com/tynnpdhsp/SaigonOS/issues"
Changelog = "https://github.com/tynnpdhsp/SaigonOS/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "packaging>=24",
    "pip-licenses>=5.5",
    "pytest>=9",
    "pytest-cov>=7",
    "reuse>=6.3",
    "ruff>=0.17",
    "uv>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saigonos"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603"]
"src/saigonos/compose.py" = ["S603"]
"tests/*" = ["S101"]
"tests/integration/*" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["--strict-markers", "--strict-config", "-m", "not integration"]
markers = ["integration: kiểm thử tích hợp, cần Docker để chạy cả bộ Docker Compose"]

[tool.coverage.run]
source_pkgs = ["saigonos"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
