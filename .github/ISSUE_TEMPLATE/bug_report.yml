# SPDX-License-Identifier: Apache-2.0
name: Báo lỗi
description: Báo một lỗi của SaigonOS
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Chuyện gì đã xảy ra
      description: Mô tả lỗi bạn gặp và điều bạn mong đợi.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. Chạy lệnh ...
        2. Mở trang ...
        3. Thấy lỗi ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Phiên bản SaigonOS
      description: Kết quả của lệnh `saigonos --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Môi trường
      description: Hệ điều hành, phiên bản Python và Docker.
  - type: textarea
    id: logs
    attributes:
      label: Nhật ký lỗi
      description: Dán nguyên văn thông báo lỗi. Nhớ xóa mật khẩu và khóa bí mật.
      render: text
