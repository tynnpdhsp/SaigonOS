# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Kiểm tra tag nằm trên branch main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cài đặt công cụ từ lock file
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Chạy lại toàn bộ kiểm tra
        run: make check
      - name: Kiểm tra tag khớp phiên bản và lấy release notes từ CHANGELOG
        run: python scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Đóng gói mã nguồn
        run: make dist VERSION="${TAG#v}"
      - name: Tạo draft release
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --title "SaigonOS ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
      - name: Đính kèm file vào draft release
        run: gh release upload "$TAG" dist/*
      - name: Công bố release
        run: gh release edit "$TAG" --draft=false
