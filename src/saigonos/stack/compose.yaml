services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saigonos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./config/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=saigonos"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${SAIGONOS_URL:?}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s

  etcd:
    image: quay.io/coreos/etcd:v3.6.16
    restart: unless-stopped
    command:
      - etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  apisix:
    image: apache/apisix:3.19.0-ubuntu
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?}
    ports:
      - ${SAIGONOS_HTTP_PORT:?}:9080
      - 127.0.0.1:${SAIGONOS_ADMIN_PORT:?}:9180
    volumes:
      - ./config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  routes:
    image: apache/apisix:3.19.0-ubuntu
    restart: "no"
    depends_on:
      apisix:
        condition: service_healthy
    environment:
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?}
    volumes:
      - ./config/apisix:/config:ro
    entrypoint: ["sh", "-c"]
    command: ["resty -I /usr/local/apisix/deps/share/lua/5.1 /config/load-routes.lua /config/routes/*.json"]

  jwks:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      JWKS_URL: http://keycloak:8080/auth/realms/saigonos/protocol/openid-connect/certs
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: authenticator
      PGPASSWORD: ${POSTGREST_DB_PASSWORD:?}
    volumes:
      - jwks:/jwks
      - ./config/postgrest:/config:ro
    # tmpfs thay cho volume vô danh mà image postgres tự tạo ở đường dẫn này
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["sh", "/config/fetch-jwks.sh"]

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      jwks:
        condition: service_completed_successfully
      routes:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: authenticator
      PGPASSWORD: ${POSTGREST_DB_PASSWORD:?}
      PGRST_DB_SCHEMAS: api
      PGRST_JWT_SECRET: "@/jwks/jwks.json"
      PGRST_JWT_ROLE_CLAIM_KEY: '$$.realm_access.roles[?(@ == "authenticated")]'
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: 3001
    volumes:
      - jwks:/jwks:ro
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

volumes:
  postgres-data:
  etcd-data:
  jwks:
