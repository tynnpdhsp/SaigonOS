# SPDX-License-Identifier: Apache-2.0
services:
  zoneinfo:
    image: postgres:18.6-alpine
    restart: "no"
    network_mode: none
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - zoneinfo:/zoneinfo
      - ./config/zoneinfo/copy.sh:/config/copy.sh:ro
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["sh", "/config/copy.sh"]

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    depends_on:
      zoneinfo:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - timezone=${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      - -c
      - log_timezone=${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      POSTGRES_DB: saigonos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=saigonos"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start", "--import-realm"]
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${SAIGONOS_URL:?}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    ports:
      - host_ip: 127.0.0.1
        published: ${SAIGONOS_KEYCLOAK_PORT:?}
        target: 8080
    volumes:
      - ./config/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s

  etcd:
    image: quay.io/coreos/etcd:v3.6.16
    restart: unless-stopped
    command:
      - etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  waf:
    image: postgres:18.6-alpine
    restart: "no"
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      CORAZA_VERSION: "0.6.0"
      CORAZA_ZIP_SHA256: cca4e3c75cf6b2e615907f936a1b6dcd0955250e0fb7d3b1c2ecef807d84603c
      CORAZA_WASM_SHA256: f36e710529167482df820b790981230092da098d26d21aebb16f1d9c8c4e26d5
    networks:
      - waf
    volumes:
      - wasm:/wasm
      - ./config/apisix/fetch-coraza.sh:/config/fetch-coraza.sh:ro
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["sh", "/config/fetch-coraza.sh"]

  apisix:
    image: apache/apisix:3.19.0-ubuntu
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      waf:
        condition: service_completed_successfully
      zoneinfo:
        condition: service_completed_successfully
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?}
      SAIGONOS_HTTP_PORT: ${SAIGONOS_HTTP_PORT:?}
      SAIGONOS_MAX_FILE_SIZE: ${SAIGONOS_MAX_FILE_SIZE:?}
    ports:
      - host_ip: ${SAIGONOS_HTTP_HOST:?}
        published: ${SAIGONOS_HTTP_PORT:?}
        target: ${SAIGONOS_HTTP_PORT:?}
      - host_ip: 127.0.0.1
        published: ${SAIGONOS_ADMIN_PORT:?}
        target: 9180
    networks:
      - default
      - policy
    volumes:
      - ./config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./config/apisix/saigonos-dns.lua:/usr/local/apisix/saigonos/saigonos-dns.lua:ro
      - ./config/apisix/saigonos-waf.lua:/usr/local/apisix/saigonos/apisix/plugins/saigonos-waf.lua:ro
      - wasm:/usr/local/apisix/wasm:ro
      - zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  policies:
    image: openpolicyagent/opa:1.22.4
    restart: "no"
    network_mode: none
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      SAIGONOS_ADMIN_NETWORKS: ${SAIGONOS_ADMIN_NETWORKS:-}
    volumes:
      - ./config/opa:/policies:ro
    command:
      - eval
      - --fail-defined
      - --format=raw
      - --ignore=.*
      - --data=/policies
      - data.saigonos.admin.config_errors[_]

  opa:
    image: openpolicyagent/opa:1.22.4
    restart: unless-stopped
    depends_on:
      policies:
        condition: service_completed_successfully
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --authorization=basic
      - --watch
      - --ignore=.*
      - --skip-version-check
      - --log-level=error
      - /policies
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      SAIGONOS_ADMIN_NETWORKS: ${SAIGONOS_ADMIN_NETWORKS:-}
    networks:
      - policy
    volumes:
      - ./config/opa:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "http.send({\"method\": \"GET\", \"url\": \"http://127.0.0.1:8181/health\"}).status_code = 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  routes:
    image: apache/apisix:3.19.0-ubuntu
    restart: "no"
    depends_on:
      apisix:
        condition: service_healthy
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?}
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      SAIGONOS_WAF_MODE: ${SAIGONOS_WAF_MODE:-block}
      SAIGONOS_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - ./config/apisix:/config:ro
    entrypoint: ["sh", "-c"]
    command: ["resty -I /usr/local/apisix/deps/share/lua/5.1 /config/load-routes.lua /config/routes/*.json /config/global-rules/*.json"]

  realm:
    image: apache/apisix:3.19.0-ubuntu
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      KEYCLOAK_URL: http://keycloak:8080/auth
      MASTER_FRONTEND_URL: http://localhost:${SAIGONOS_KEYCLOAK_PORT:?}/auth
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      OPERATON_CLIENT_SECRET: ${OPERATON_CLIENT_SECRET:?}
      GRAFANA_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET:?}
      SAIGONOS_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - ./config/keycloak:/config:ro
    entrypoint: ["resty", "-I", "/usr/local/apisix/deps/share/lua/5.1", "/config/setup-realm.lua"]

  jwks:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      JWKS_URL: http://keycloak:8080/auth/realms/saigonos/protocol/openid-connect/certs
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: authenticator
      PGPASSWORD: ${POSTGREST_DB_PASSWORD:?}
    volumes:
      - jwks:/jwks
      - ./config/postgrest:/config:ro
    # tmpfs thay cho volume vô danh mà image postgres tự tạo ở đường dẫn này
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["sh", "/config/fetch-jwks.sh"]

  migrate:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      databases:
        condition: service_completed_successfully
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?}
    volumes:
      - ./config/postgres:/config:ro
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["sh", "/config/migrate.sh"]
    command: ["core", "/config/migrations"]

  databases:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      OPERATON_DB_PASSWORD: ${OPERATON_DB_PASSWORD:?}
      CENTRIFUGO_DB_PASSWORD: ${CENTRIFUGO_DB_PASSWORD:?}
    volumes:
      - ./config/postgres:/config:ro
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["psql", "--no-psqlrc", "--quiet", "--set=ON_ERROR_STOP=1", "--file=/config/databases.sql"]

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      jwks:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      realm:
        condition: service_completed_successfully
      routes:
        condition: service_completed_successfully
      zoneinfo:
        condition: service_completed_successfully
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: authenticator
      PGPASSWORD: ${POSTGREST_DB_PASSWORD:?}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_PRE_CONFIG: core.pre_config
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_PRE_REQUEST: core.pre_request
      PGRST_DB_PREPARED_STATEMENTS: "false"
      PGRST_JWT_SECRET: "@/jwks/jwks.json"
      PGRST_JWT_ROLE_CLAIM_KEY: '$$.realm_access.roles[?(@ == "authenticated")]'
      PGRST_OPENAPI_MODE: follow-privileges
      PGRST_OPENAPI_SECURITY_ACTIVE: "true"
      PGRST_OPENAPI_SERVER_PROXY_URI: ${SAIGONOS_URL:?}/api
      PGRST_ADMIN_SERVER_HOST: 0.0.0.0
      PGRST_ADMIN_SERVER_PORT: 3001
    volumes:
      - jwks:/jwks:ro
      - zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    depends_on:
      zoneinfo:
        condition: service_completed_successfully
    command:
      - mini
      - -ip=seaweedfs
      - -master.telemetry=false
      - -filer.disableDirListing
      - -s3.autoCreateBucket=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -admin.port.legacy=0
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      S3_BUCKET: quarantine,clean,lake
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?}
      WEED_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:?}
    ports:
      - host_ip: 127.0.0.1
        published: ${SAIGONOS_SEAWEEDFS_PORT:?}
        target: 12535
    networks:
      - storage
    volumes:
      - seaweedfs-data:/data
      - ./config/seaweedfs:/config:ro
      - zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "sh", "/config/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  clamav:
    image: clamav/clamav-debian:1.5.4
    restart: unless-stopped
    # clamd là tiến trình chính để container tự chạy lại khi clamd dừng
    command: ["clamd", "--foreground"]
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    networks:
      - scan
    volumes:
      - clamav-data:/var/lib/clamav
      - ./config/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 2s

  freshclam:
    image: clamav/clamav-debian:1.5.4
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_started
    command: ["freshclam", "--daemon", "--foreground"]
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    networks:
      - updates
    volumes:
      - clamav-data:/var/lib/clamav
      - ./config/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    healthcheck:
      test: ["CMD", "pidof", "freshclam"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  core:
    build: ./core
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      processes:
        condition: service_completed_successfully
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      JWT_ISSUER: ${SAIGONOS_URL:?}/auth/realms/saigonos
      JWKS_URL: http://keycloak:8080/auth/realms/saigonos/protocol/openid-connect/certs
      PUBLIC_URL: ${SAIGONOS_URL:?}/core
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: core_service
      PGPASSWORD: ${CORE_DB_PASSWORD:?}
      S3_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:?}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:?}
      MAX_FILE_SIZE: ${SAIGONOS_MAX_FILE_SIZE:?}
      DOWNLOAD_KEY: ${CORE_DOWNLOAD_KEY:?}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OPERATON_URL: http://operaton:8080/operaton/engine-rest
      OPERATON_PASSWORD: ${CORE_OPERATON_PASSWORD:?}
      SUBSCRIPTION_KEY: ${CENTRIFUGO_SUBSCRIPTION_KEY:?}
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TOPIC_ID: ${TELEGRAM_TOPIC_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      LAKE_TIMEZONE: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - ./apps:/apps:ro
    networks:
      - default
      - storage
      - scan
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  operaton:
    image: operaton/operaton:2.2.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      databases:
        condition: service_completed_successfully
    command: ["./operaton.sh", "--production", "--webapps", "--rest", "--oauth2"]
    # tini gửi SIGINT cho cả nhóm tiến trình, run.sh của image chờ Java tắt xong rồi mới thoát
    stop_signal: SIGINT
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      OPERATON_DB_PASSWORD: ${OPERATON_DB_PASSWORD:?}
      OPERATON_CLIENT_SECRET: ${OPERATON_CLIENT_SECRET:?}
      CORE_OPERATON_PASSWORD: ${CORE_OPERATON_PASSWORD:?}
      JAVA_OPTS: -Xms128m -Xmx512m
      TINI_KILL_PROCESS_GROUP: "1"
    volumes:
      - ./config/operaton/production.yml:/operaton/configuration/production.yml:ro
      # file trong thư mục public được Operaton dùng thay cho file cùng đường dẫn của plugin
      - ./config/operaton/sso-logout.js:/operaton/public/plugin-webapp/sso-logout-plugin/app/plugin.js:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/operaton/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s

  processes:
    image: apache/apisix:3.19.0-ubuntu
    restart: "no"
    depends_on:
      operaton:
        condition: service_healthy
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      OPERATON_URL: http://operaton:8080/operaton/engine-rest
      CORE_OPERATON_PASSWORD: ${CORE_OPERATON_PASSWORD:?}
    volumes:
      - ./config/operaton:/config:ro
    entrypoint: ["sh", "-c"]
    command: ["resty -I /usr/local/apisix/deps/share/lua/5.1 /config/deploy-processes.lua /config/processes/*.bpmn"]

  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      zoneinfo:
        condition: service_completed_successfully
    command: ["centrifugo", "--config", "/centrifugo/config.yaml"]
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      CENTRIFUGO_CLIENT_TOKEN_ISSUER: ${SAIGONOS_URL:?}/auth/realms/saigonos
      CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SUBSCRIPTION_KEY:?}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGIN:?}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:?}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:?}
      CENTRIFUGO_CONSUMERS_OUTBOX_POSTGRESQL_DSN: postgresql://centrifugo:${CENTRIFUGO_DB_PASSWORD:?}@postgres:5432/saigonos
    ports:
      - host_ip: 127.0.0.1
        published: ${SAIGONOS_CENTRIFUGO_PORT:?}
        target: 9000
    volumes:
      - ./config/centrifugo/config.yaml:/centrifugo/config.yaml:ro
      - zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  caddy:
    image: caddy:2.11.9-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      apisix:
        condition: service_healthy
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      SAIGONOS_HTTP_PORT: ${SAIGONOS_HTTP_PORT:?}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-80}
    volumes:
      - ./config/caddy:/etc/caddy:ro
      - ./data/caddy:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$$CADDY_HTTP_PORT/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  socket-proxy:
    image: wollomatic/socket-proxy:1.13.2
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      zoneinfo:
        condition: service_completed_successfully
    # root không có capability nào vẫn mở được Docker socket vì socket thuộc root
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command:
      - -listenip=0.0.0.0
      - -allowfrom=alloy,exporter
      - -allowHEAD=/_ping
      - -allowGET=(/v[0-9.]+)?/(_ping|networks|containers/json|containers/[0-9a-f]{64}/(json|logs|stats))
      - -allowhealthcheck
      - -watchdoginterval=60
      - -stoponwatchdog
      - -loglevel=WARN
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    networks:
      - docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  exporter:
    build: ./core
    pull_policy: build
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_healthy
    entrypoint: ["python", "-m", "saigonos_core.exporter"]
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      DOCKER_URL: http://socket-proxy:2375
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    networks:
      - docker
      - monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      apisix:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      postgrest:
        condition: service_healthy
      etcd:
        condition: service_healthy
      loki:
        condition: service_healthy
      exporter:
        condition: service_healthy
      core:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    networks:
      - default
      - monitoring
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus:/etc/prometheus:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  loki-probe:
    image: busybox:1.38.0-musl
    profiles: ["monitoring"]
    restart: "no"
    network_mode: none
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - probe:/probe
    command: ["sh", "-c", "cp /bin/busybox /probe/.busybox && mv -f /probe/.busybox /probe/busybox"]

  loki:
    image: grafana/loki:3.7.10
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      loki-probe:
        condition: service_completed_successfully
    command: ["-config.file=/etc/loki/config.yaml"]
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    networks:
      - monitoring
    volumes:
      - loki-data:/loki
      - ./config/loki/config.yaml:/etc/loki/config.yaml:ro
      # image của Loki không có shell, healthcheck dùng busybox tĩnh do loki-probe chép vào
      - probe:/probe:ro
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  alloy:
    image: grafana/alloy:v1.22.0
    profiles: ["monitoring"]
    restart: unless-stopped
    user: "473:473"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      socket-proxy:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    networks:
      - docker
      - monitoring
    volumes:
      - alloy-data:/var/lib/alloy/data
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      GF_SERVER_ROOT_URL: ${SAIGONOS_URL:?}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET:?}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${SAIGONOS_URL:?}/auth/realms/saigonos/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/auth/realms/saigonos/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/auth/realms/saigonos/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "${SAIGONOS_URL:?}/auth/realms/saigonos/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=${SAIGONOS_URL:?}/grafana/login"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admin') && 'GrafanaAdmin'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_CLOUD_MIGRATION_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_LOG_LEVEL: warn
      GF_LOG_FILTERS: search-manifest-watcher:error
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/saigonos.json
    networks:
      - default
      - monitoring
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  backup:
    image: postgres:18.6-alpine
    profiles: ["backup"]
    restart: "no"
    network_mode: none
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - seaweedfs-data:/seaweedfs
    entrypoint: ["tar"]

  apps:
    build: ./core
    pull_policy: build
    profiles: ["apps"]
    restart: "no"
    entrypoint: ["python", "-m", "saigonos_core.apps"]
    environment:
      TZ: ${SAIGONOS_TIMEZONE:-Asia/Ho_Chi_Minh}
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?}
      OPERATON_URL: http://operaton:8080/operaton/engine-rest
      CORE_OPERATON_PASSWORD: ${CORE_OPERATON_PASSWORD:?}
    volumes:
      - ./apps:/apps:ro

volumes:
  zoneinfo:
  postgres-data:
  etcd-data:
  wasm:
  jwks:
  seaweedfs-data:
  clamav-data:
  prometheus-data:
  probe:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  storage:
  scan:
    internal: true
  policy:
    internal: true
  updates:
  waf:
  monitoring:
    internal: true
  docker:
    internal: true
