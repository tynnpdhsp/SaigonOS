services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saigonos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=saigonos"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${SAIGONOS_URL:?}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    ports:
      - host_ip: 127.0.0.1
        published: ${SAIGONOS_KEYCLOAK_PORT:?}
        target: 8080
    volumes:
      - ./config/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s

  etcd:
    image: quay.io/coreos/etcd:v3.6.16
    restart: unless-stopped
    command:
      - etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  apisix:
    image: apache/apisix:3.19.0-ubuntu
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?}
      SAIGONOS_HTTP_PORT: ${SAIGONOS_HTTP_PORT:?}
      SAIGONOS_MAX_FILE_SIZE: ${SAIGONOS_MAX_FILE_SIZE:?}
    ports:
      - host_ip: ${SAIGONOS_HTTP_HOST:?}
        published: ${SAIGONOS_HTTP_PORT:?}
        target: ${SAIGONOS_HTTP_PORT:?}
      - host_ip: 127.0.0.1
        published: ${SAIGONOS_ADMIN_PORT:?}
        target: 9180
    volumes:
      - ./config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./config/apisix/saigonos-dns.lua:/usr/local/apisix/saigonos/saigonos-dns.lua:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  routes:
    image: apache/apisix:3.19.0-ubuntu
    restart: "no"
    depends_on:
      apisix:
        condition: service_healthy
    environment:
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?}
    volumes:
      - ./config/apisix:/config:ro
    entrypoint: ["sh", "-c"]
    command: ["resty -I /usr/local/apisix/deps/share/lua/5.1 /config/load-routes.lua /config/routes/*.json"]

  realm:
    image: apache/apisix:3.19.0-ubuntu
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      MASTER_FRONTEND_URL: http://localhost:${SAIGONOS_KEYCLOAK_PORT:?}/auth
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      OPERATON_CLIENT_SECRET: ${OPERATON_CLIENT_SECRET:?}
    volumes:
      - ./config/keycloak:/config:ro
    entrypoint: ["resty", "-I", "/usr/local/apisix/deps/share/lua/5.1", "/config/setup-realm.lua"]

  jwks:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      JWKS_URL: http://keycloak:8080/auth/realms/saigonos/protocol/openid-connect/certs
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: authenticator
      PGPASSWORD: ${POSTGREST_DB_PASSWORD:?}
    volumes:
      - jwks:/jwks
      - ./config/postgrest:/config:ro
    # tmpfs thay cho volume vô danh mà image postgres tự tạo ở đường dẫn này
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["sh", "/config/fetch-jwks.sh"]

  migrate:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      databases:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?}
    volumes:
      - ./config/postgres:/config:ro
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["sh", "/config/migrate.sh"]
    command: ["core", "/config/migrations"]

  databases:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      OPERATON_DB_PASSWORD: ${OPERATON_DB_PASSWORD:?}
      CENTRIFUGO_DB_PASSWORD: ${CENTRIFUGO_DB_PASSWORD:?}
    volumes:
      - ./config/postgres:/config:ro
    tmpfs:
      - /var/lib/postgresql
    entrypoint: ["psql", "--no-psqlrc", "--quiet", "--set=ON_ERROR_STOP=1", "--file=/config/databases.sql"]

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      jwks:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      realm:
        condition: service_completed_successfully
      routes:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: authenticator
      PGPASSWORD: ${POSTGREST_DB_PASSWORD:?}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_PRE_REQUEST: core.pre_request
      PGRST_DB_PREPARED_STATEMENTS: "false"
      PGRST_JWT_SECRET: "@/jwks/jwks.json"
      PGRST_JWT_ROLE_CLAIM_KEY: '$$.realm_access.roles[?(@ == "authenticated")]'
      PGRST_OPENAPI_MODE: follow-privileges
      PGRST_OPENAPI_SECURITY_ACTIVE: "true"
      PGRST_OPENAPI_SERVER_PROXY_URI: ${SAIGONOS_URL:?}/api
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: 3001
    volumes:
      - jwks:/jwks:ro
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    command:
      - mini
      - -ip=seaweedfs
      - -master.telemetry=false
      - -filer.disableDirListing
      - -s3.autoCreateBucket=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -admin.port.legacy=0
    environment:
      S3_BUCKET: quarantine,clean
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?}
      WEED_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:?}
    ports:
      - host_ip: 127.0.0.1
        published: ${SAIGONOS_SEAWEEDFS_PORT:?}
        target: 12535
    networks:
      - storage
    volumes:
      - seaweedfs-data:/data
      - ./config/seaweedfs:/config:ro
    healthcheck:
      test: ["CMD", "sh", "/config/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  clamav:
    image: clamav/clamav-debian:1.5.4
    restart: unless-stopped
    # clamd là tiến trình chính để container tự chạy lại khi clamd dừng
    command: ["clamd", "--foreground"]
    networks:
      - scan
    volumes:
      - clamav-data:/var/lib/clamav
      - ./config/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 2s

  freshclam:
    image: clamav/clamav-debian:1.5.4
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_started
    command: ["freshclam", "--daemon", "--foreground"]
    networks:
      - updates
    volumes:
      - clamav-data:/var/lib/clamav
      - ./config/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    healthcheck:
      test: ["CMD", "pidof", "freshclam"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  core:
    build: ./core
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      processes:
        condition: service_completed_successfully
    environment:
      JWT_ISSUER: ${SAIGONOS_URL:?}/auth/realms/saigonos
      JWKS_URL: http://keycloak:8080/auth/realms/saigonos/protocol/openid-connect/certs
      PUBLIC_URL: ${SAIGONOS_URL:?}/core
      PGHOST: postgres
      PGDATABASE: saigonos
      PGUSER: core_service
      PGPASSWORD: ${CORE_DB_PASSWORD:?}
      S3_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:?}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:?}
      MAX_FILE_SIZE: ${SAIGONOS_MAX_FILE_SIZE:?}
      DOWNLOAD_KEY: ${CORE_DOWNLOAD_KEY:?}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OPERATON_URL: http://operaton:8080/operaton/engine-rest
      OPERATON_PASSWORD: ${CORE_OPERATON_PASSWORD:?}
      SUBSCRIPTION_KEY: ${CENTRIFUGO_SUBSCRIPTION_KEY:?}
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TOPIC_ID: ${TELEGRAM_TOPIC_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
    networks:
      - default
      - storage
      - scan
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  operaton:
    image: operaton/operaton:2.2.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      databases:
        condition: service_completed_successfully
    command: ["./operaton.sh", "--production", "--webapps", "--rest", "--oauth2"]
    # tini gửi SIGINT cho cả nhóm tiến trình, run.sh của image chờ Java tắt xong rồi mới thoát
    stop_signal: SIGINT
    environment:
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      OPERATON_DB_PASSWORD: ${OPERATON_DB_PASSWORD:?}
      OPERATON_CLIENT_SECRET: ${OPERATON_CLIENT_SECRET:?}
      CORE_OPERATON_PASSWORD: ${CORE_OPERATON_PASSWORD:?}
      JAVA_OPTS: -Xms128m -Xmx512m
      TINI_KILL_PROCESS_GROUP: "1"
    volumes:
      - ./config/operaton/production.yml:/operaton/configuration/production.yml:ro
      # file trong thư mục public được Operaton dùng thay cho file cùng đường dẫn của plugin
      - ./config/operaton/sso-logout.js:/operaton/public/plugin-webapp/sso-logout-plugin/app/plugin.js:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/operaton/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s

  processes:
    image: apache/apisix:3.19.0-ubuntu
    restart: "no"
    depends_on:
      operaton:
        condition: service_healthy
    environment:
      OPERATON_URL: http://operaton:8080/operaton/engine-rest
      CORE_OPERATON_PASSWORD: ${CORE_OPERATON_PASSWORD:?}
    volumes:
      - ./config/operaton:/config:ro
    entrypoint: ["sh", "-c"]
    command: ["resty -I /usr/local/apisix/deps/share/lua/5.1 /config/deploy-processes.lua /config/processes/*.bpmn"]

  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["centrifugo", "--config", "/centrifugo/config.yaml"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_ISSUER: ${SAIGONOS_URL:?}/auth/realms/saigonos
      CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SUBSCRIPTION_KEY:?}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${SAIGONOS_URL:?}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:?}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:?}
      CENTRIFUGO_CONSUMERS_OUTBOX_POSTGRESQL_DSN: postgresql://centrifugo:${CENTRIFUGO_DB_PASSWORD:?}@postgres:5432/saigonos
    ports:
      - host_ip: 127.0.0.1
        published: ${SAIGONOS_CENTRIFUGO_PORT:?}
        target: 9000
    volumes:
      - ./config/centrifugo/config.yaml:/centrifugo/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  caddy:
    image: caddy:2.11.9-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      apisix:
        condition: service_healthy
    environment:
      SAIGONOS_URL: ${SAIGONOS_URL:?}
      SAIGONOS_HTTP_PORT: ${SAIGONOS_HTTP_PORT:?}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-80}
    volumes:
      - ./config/caddy:/etc/caddy:ro
      - ./data/caddy:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$$CADDY_HTTP_PORT/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

volumes:
  postgres-data:
  etcd-data:
  jwks:
  seaweedfs-data:
  clamav-data:

networks:
  storage:
  scan:
    internal: true
  updates:
