# SPDX-License-Identifier: Apache-2.0
global:
  scrape_interval: 15s
  evaluation_interval: 5s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: services
    static_configs:
      - targets: ["exporter:9100"]
  - job_name: apisix
    scrape_interval: 5s
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091"]
  - job_name: keycloak
    metrics_path: /auth/metrics
    static_configs:
      - targets: ["keycloak:9000"]
  - job_name: centrifugo
    static_configs:
      - targets: ["centrifugo:9000"]
  - job_name: postgrest
    static_configs:
      - targets: ["postgrest:3001"]
  - job_name: etcd
    static_configs:
      - targets: ["etcd:2379"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
